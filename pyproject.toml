[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "julia-mandelbrot"
version = "0.1.0"
description = "Market-state indicator research package"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0"]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
julia-mandelbrot = "julia_mandelbrot.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
